<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="B737 EFB 入职每日微课学习辅助。飞行运行以公司现行有效版手册为准。" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <link rel="icon" href="./icons/icon.svg" />
  <link rel="stylesheet" href="./css/app.css" />
  <title>B737 EFB 每日微课</title>
</head>
<body>
  <header class="app-header">
    <h1 id="app-title">B737 EFB 每日微课</h1>
    <div class="sub">个人学习辅助 · 以现行 EFB 手册为准</div>
  </header>

  <main>
    <section class="view active" data-view="today" id="view-today"></section>
    <section class="view" data-view="courses" id="view-courses"></section>
    <section class="view" data-view="review" id="view-review"></section>
    <section class="view" data-view="me" id="view-me"></section>
    <section class="view" data-view="lesson" id="view-lesson"></section>
  </main>

  <nav class="bottom-nav" aria-label="底部导航">
    <button type="button" data-nav="today" class="active"><span class="ico">📅</span>今日</button>
    <button type="button" data-nav="courses"><span class="ico">📚</span>课程</button>
    <button type="button" data-nav="review"><span class="ico">🔁</span>复习</button>
    <button type="button" data-nav="me"><span class="ico">👤</span>我的</button>
  </nav>

  <script src="./js/app.js"></script>
</body>
</html>
